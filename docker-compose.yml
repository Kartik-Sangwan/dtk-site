services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dtk
      POSTGRES_USER: dtkuser
      POSTGRES_PASSWORD: dtkpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtkuser -d dtk"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
